<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot Drift</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --fg:#e8e8e8; --muted:#8a8f98; --p1:#e8413c; --p2:#3c8ee8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  #wrap { display:flex; height:100%; }
  #game { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  #side { width:290px; background:var(--panel); padding:14px; overflow-y:auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 0 8px; }
  h2:first-child { margin-top:0; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  button { padding:7px 8px; border:1px solid #444; background:#2b2f37; color:var(--fg); border-radius:6px; cursor:pointer; font:inherit; font-size:13px; }
  button:hover { background:#353a44; }
  button:disabled { opacity:.4; cursor:default; }
  .seg { display:flex; gap:4px; }
  .seg button { flex:1; padding:7px 4px; }
  .seg button.on { background:#3a4250; border-color:#7a8597; }
  .btns { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
  .btns button { flex:1; }
  .radio { display:flex; gap:8px; align-items:center; margin:5px 0; font-size:13px; cursor:pointer; }
  .radio.dis { opacity:.4; cursor:default; }
  .radio small { color:var(--muted); }
  #carGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  #carGrid button { padding:5px 3px; background:#14161a; border:1px solid #333; border-radius:6px; line-height:0; }
  #carGrid button:hover { background:#1c2027; }
  #carGrid button.on { background:#2b3140; border-color:#9aa6bd; }
  #carGrid img { width:100%; display:block; }
  .credit { margin-top:18px; }
  .credit a { color:#9aa4b5; }
  select { width:100%; padding:7px; background:#14161a; color:var(--fg); border:1px solid #444; border-radius:6px; font:inherit; }
  #name { width:100%; margin-top:4px; padding:6px; background:#14161a; color:var(--fg); border:1px solid #444; border-radius:6px; font:inherit; }
  #sliders label { display:block; margin:10px 0 2px; font-size:12px; }
  #sliders label span { float:right; color:var(--muted); font-variant-numeric: tabular-nums; }
  #sliders.locked { opacity:.5; }
  input[type=range] { width:100%; }
  #copy { width:100%; margin-top:14px; }
  kbd { background:#2b2f37; border:1px solid #444; border-radius:4px; padding:0 5px; font-size:12px; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid #444; border-radius:10px; width:min(520px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog textarea { width:100%; height:140px; background:#14161a; color:var(--fg); border:1px solid #444; border-radius:6px; font:12px monospace; }
  #impMsg { min-height:1.4em; font-size:12px; color:#ff8a7a; margin-top:6px; }
  #toast { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:#2b2f37; border:1px solid #555; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"><canvas id="c"></canvas><div id="toast"></div></div>
  <div id="side">
    <h2>Pista</h2>
    <select id="trackSel"></select>

    <h2>Modo</h2>
    <div class="seg">
      <button data-mode="libre">Libre</button>
      <button data-mode="crono">Contrarreloj</button>
    </div>
    <div class="hint" id="modeHint"></div>

    <h2>Auto</h2>
    <div id="carGrid"></div>

    <h2>Sonido <kbd>M</kbd></h2>
    <div class="seg"><button id="muteBtn">Silenciar</button></div>
    <label class="hint" style="display:block;margin-top:8px">Volumen <span id="volVal" style="float:right"></span>
      <input id="vol" type="range" min="0" max="1" step="0.05">
    </label>

    <div id="ghostBox">
      <h2>Fantasma</h2>
      <div id="ghostList"></div>
      <div class="btns">
        <button id="expBest">Exportar mejor</button>
        <button id="expLast">Exportar última</button>
        <button id="impBtn">Importar</button>
      </div>
      <label class="hint" style="display:block;margin-top:10px">Tu nombre (va dentro de tus fantasmas)
        <input id="name" maxlength="20" placeholder="Anónimo">
      </label>
    </div>

    <h2>Controles</h2>
    <div class="hint" id="keysHint"></div>

    <!-- Controles de física ocultos (siguen en el código; para verlos, sacar style="display:none") -->
    <div id="physBox" style="display:none">
      <h2>Física</h2>
      <div class="hint" id="physNote"></div>
      <div id="sliders"></div>
      <button id="copy">Copiar parámetros</button>
      <div class="hint">El indicador de deriva muestra cuánto se cruza la cola. Si llega a la línea roja, el coche se sale.</div>
    </div>
    <div class="hint credit">Autos: <a href="https://www.magnific.com/free-vector/sport-cars-top-view-set_3797254.htm" target="_blank" rel="noopener">Image by macrovector on Magnific</a></div>
  </div>
</div>

<dialog id="impDlg">
  <h2 style="margin-top:0">Importar fantasma</h2>
  <div class="hint" style="margin-bottom:8px">Pegá el texto que te pasaron (empieza con <code>SDG1.</code>).</div>
  <textarea id="impText" spellcheck="false"></textarea>
  <div id="impMsg"></div>
  <div class="btns"><button id="impOk">Cargar</button><button id="impCancel">Cancelar</button></div>
</dialog>

<script>
// ---------- Parámetros ----------
const P = {
  MU:     { min:600,  max:5000, step:50,  label:'Agarre neumáticos (px/s²)' },
  KIN:    { min:0.5,  max:1.0,  step:0.01,label:'Agarre deslizando / estático' },
  C:      { min:10,   max:120,  step:1,   label:'Rigidez lateral neumático' },
  MAXANG: { min:20,   max:110,  step:1,   label:'Ángulo máx. antes de salirse (°)' },
  GUIDE:  { min:2000, max:15000,step:100, label:'Límite de la guía / imán (px/s²)' },
  POWER:  { min:400,  max:2500, step:50,  label:'Potencia motor' },
  BRAKE:  { min:0,    max:2500, step:50,  label:'Freno motor al soltar' },
};
// Física oficial: fija en Carrera y Contrarreloj. Si cambia, subir PHYS_VERSION
// (los fantasmas de otra versión dejan de ser compatibles).
const OFFICIAL = { MU:3000, KIN:0.8, C:60, MAXANG:65, GUIDE:6500, POWER:1600, BRAKE:500 };
const PHYS_VERSION = 1;
const freeVals = { ...OFFICIAL };
for (const k in P) P[k].v = OFFICIAL[k];

const L = 26;          // distancia guía → eje trasero (px)
const DRAG = 1.4;      // rozamiento proporcional a v
const DAMP = 4;        // amortiguación del giro del chasis
const SCRUB = 2.0;     // pérdida de velocidad al ir cruzado
const LANE = 22;       // separación del carril respecto al centro
const LAPS = 4;        // vueltas por carrera (par: con el cruce de carriles, 2 vueltas = mismo recorrido)
const PENALTY = 1;     // segundos de freno casi total tras largar, si hubo largada en falso
const PENALTY_V = 25;  // velocidad máxima (unidades/s) durante esa penalización: el coche apenas se arrastra
const GHOST_HZ = 30;   // muestras por segundo del fantasma

// ---------- Pistas ----------
// Una pista es un dato: piezas (rectas 'S' y arcos 'A' de radio constante, con ángulo
// con signo) y, opcionalmente:
//  · swap: cruce de carriles. Con un solo cruce, cada coche hace media pista en un carril
//    y media en el otro, y cada 2 vueltas los dos recorrieron exactamente lo mismo. Por
//    eso se modela UN solo camino cerrado de doble vuelta: largar en el carril A es
//    arrancar en s = 0 y largar en el B es arrancar en la mitad (route.half).
//  · structures: tramos a otro nivel. 'bridge' = puente (se dibuja encima de todo) y
//    'tunnel' = túnel (un techo opaco que tapa al coche). Es solo cuestión de dibujo: la
//    física no cambia y, como no hay choques, tampoco importa que la pista se cruce.
// Sin swap (un 8, por ejemplo, cuyo giro neto es 0) los dos carriles miden exactamente lo
// mismo, así que cada uno es un circuito de una vuelta y no hace falta cambiarlos.
const SCALE = 1.5;
const BRIDGE_RAMP = 90;   // largo (unidades) de cada rampa de puente
const LZ = 0.8;     // escala de El Lazo: más chico para que entre en pantalla
const EIGHT = { R:170, M:240, D:339.705627 };   // D se resolvió para que el 8 cierre exacto
const TRACKS = [
  { id:'cruce-2', name:'Clásica · cruce de carriles',
    // La largada está 375 unidades adentro de la recta principal (900): la recta se parte en dos, la
    // segunda parte (S 250×1.5) va al final y la primera (S 350×1.5) al principio. El resto no cambia.
    pieces: [['S',350],['A',180,140],['S',200],['A',-90,80],['A',90,80],['S',240],['A',90,100],['S',240],['A',90,100],['S',250]]
      .map(p => p[0]==='S' ? ['S', p[1]*SCALE] : ['A', p[1], p[2]*SCALE]),
    swap: { piece:5, len:260 },       // el cruce de carriles va en la recta después de la S
    structures: [] },
  { id:'ocho-1', name:'El Ocho · túnel y puente',
    th0: -Math.PI/4,                   // arranca mirando arriba a la derecha: el 8 queda acostado (∞)
    pieces: [['S',2*EIGHT.D],['A',135,EIGHT.R],['S',EIGHT.M],['A',135,EIGHT.R],
             ['S',2*EIGHT.D],['A',-135,EIGHT.R],['S',EIGHT.M],['A',-135,EIGHT.R]],
    swap: null,
    structures: [   // el centro de cada recta larga es el punto donde se cruzan
      { kind:'tunnel', piece:0, from:EIGHT.D-75,  to:EIGHT.D+75 },
      { kind:'bridge', piece:4, from:EIGHT.D-105, to:EIGHT.D+105 } ] },
  // Boceto del usuario (lazo.jpeg), a escala LZ. Va en sentido horario: recta superior (largada),
  // curva grande, bajada por la derecha, curva hacia el aro, aro de 270° que se cierra sobre la
  // bajada hacia la "cola" (se cruza consigo misma: el aro pasa por arriba, la cola por abajo),
  // U de abajo y subida por la izquierda. Giro neto de 720°: hace falta cruce de carriles.
  { id:'lazo-2', name:'El Lazo · aro y cola',
    th0: -Math.PI/2,                   // el boceto es vertical; se gira 90° para que la pista quede acostada
    pieces: [['S',330],['A',90,230],['S',360],['A',90,150],['S',270],['A',270,140],['S',380],
             ['A',180,240],['S',780],['A',90,200]]
      .map(p => p[0]==='S' ? ['S', p[1]*LZ] : ['A', p[1], p[2]*LZ]),
    swap: { piece:8, len:260 },        // cruce de carriles en la subida de la izquierda
    cross: { under:'second', tunnelHalf:70, bridgeHalf:95 } },   // el aro (primera pasada) por el puente; la cola, por el túnel
];
const DEFAULT_TRACK = TRACKS[0].id;

// Tipos de pieza:
//   ['S', largo]            recta
//   ['A', grados, radio]    arco de radio constante; el signo del ángulo da el sentido
//                           (positivo = gira a la derecha, o sea en sentido horario en pantalla)
//   ['SS', largo, lateral]  S suave: dos arcos iguales de signo opuesto que desplazan la pista
//                           'lateral' hacia un costado (positivo = a la derecha del rumbo) a lo
//                           largo de 'largo', y el rumbo vuelve a ser el de antes. El ángulo y el
//                           radio se resuelven solos para que empalme exacto.
function primitives(p) {
  if (p[0] !== 'SS') return [p];
  const len = p[1], lat = p[2];
  if (!lat) return [['S', len]];
  const th = 2*Math.atan(Math.abs(lat)/len);
  const R = len/(2*Math.sin(th)), a = th*180/Math.PI*Math.sign(lat);
  return [['A', a, R], ['A', -a, R]];
}
const pieceLen = p => p[0]==='SS' ? primitives(p).reduce((t, q) => t + pieceLen(q), 0)
                    : p[0]==='S' ? p[1] : Math.abs(p[1]*Math.PI/180)*p[2];

// Paso exacto por un arco o una recta, en el marco local del rumbo actual.
function stepExact(st, q) {
  let dx, dy, dth = 0;
  if (q[0] === 'S') { dx = q[1]; dy = 0; }
  else { const a = Math.abs(q[1])*Math.PI/180, sg = Math.sign(q[1]); dx = q[2]*Math.sin(a); dy = sg*q[2]*(1-Math.cos(a)); dth = sg*a; }
  st.x += Math.cos(st.th)*dx - Math.sin(st.th)*dy; st.y += Math.sin(st.th)*dx + Math.cos(st.th)*dy; st.th += dth;
}

// def.close = [i, j]: ajusta el largo de las rectas i y j (que no deben ser paralelas) para que el
// circuito cierre exacto. Estimar rectas a ojo nunca cierra; así solo hay que elegir las curvas.
function closePieces(def) {
  const [ia, ib] = def.close, pcs = def.pieces.map(p => p.slice());
  pcs[ia][1] = 0; pcs[ib][1] = 0;
  const st = { x:0, y:0, th:def.th0 || 0 }, head = [];
  pcs.forEach((p, i) => { head[i] = st.th; for (const q of primitives(p)) stepExact(st, q); });
  const ua = [Math.cos(head[ia]), Math.sin(head[ia])], ub = [Math.cos(head[ib]), Math.sin(head[ib])];
  const det = ua[0]*ub[1] - ua[1]*ub[0];
  if (Math.abs(det) < 1e-6) throw new Error('close: las rectas ' + ia + ' y ' + ib + ' son paralelas');
  const a = (-st.x*ub[1] + st.y*ub[0])/det, b = (-ua[0]*st.y + ua[1]*st.x)/det;
  if (a < 0 || b < 0) console.warn('close: largo negativo en', def.id, a.toFixed(1), b.toFixed(1));
  pcs[ia][1] = a; pcs[ib][1] = b;
  return pcs;
}

// Punto donde la pista se cruza consigo misma: el par de puntos más cercano que no son contiguos.
function findCrossing(pts) {
  const n = pts.length, gap = 400; let best = Infinity, bi = 0, bj = 0;
  for (let i=0;i<n;i++) for (let j=i+gap; j<n && n-(j-i) >= gap; j++) {
    const dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y, d = dx*dx + dy*dy;
    if (d < best) { best = d; bi = i; bj = j; }
  }
  return [bi, bj];
}

function buildCenter(def) {
  const pts = [], pieceStart = []; let x=0, y=0, th=def.th0 || 0;
  for (const piece of def.pieces) {
    pieceStart.push(pts.length);
    for (const p of primitives(piece)) {
      const len = pieceLen(p);
      const k = p[0]==='S' ? 0 : Math.sign(p[1])/p[2];
      const n = Math.max(1, Math.round(len));
      const ds = len/n;
      for (let i=0;i<n;i++) {
        pts.push({x,y,th,k,arc:k!==0,lv:0});
        x += Math.cos(th+k*ds/2)*ds; y += Math.sin(th+k*ds/2)*ds; th += k*ds;
      }
    }
  }
  // nivel de cada punto: 0 suelo, -1 túnel, +1 puente
  for (const st of def.structures || []) {
    const a = pieceStart[st.piece], n = (pieceStart[st.piece+1] ?? pts.length) - a, len = pieceLen(def.pieces[st.piece]);
    const i0 = a + Math.round(st.from/len*n), i1 = a + Math.round(st.to/len*n);
    for (let i=Math.max(a,i0); i<=Math.min(a+n-1,i1); i++) pts[i].lv = st.kind === 'bridge' ? 1 : -1;
  }
  // def.cross: busca solo dónde la pista se cruza consigo misma. El tramo que se recorre primero
  // va por abajo (túnel) y el otro por arriba (puente); con under:'second' se invierte.
  if (def.cross) {
    const [i, j] = findCrossing(pts), c = def.cross, tunnelFirst = c.under !== 'second';
    const mark = (k, half, v) => { for (let q=Math.max(0,k-half); q<=Math.min(pts.length-1,k+half); q++) pts[q].lv = v; };
    mark(i, tunnelFirst ? c.tunnelHalf : c.bridgeHalf, tunnelFirst ? -1 : 1);
    mark(j, tunnelFirst ? c.bridgeHalf : c.tunnelHalf, tunnelFirst ? 1 : -1);
  }
  // Rampas de los puentes: a cada lado del tramo plano la calzada sube de a poco (smoothstep) desde
  // el suelo, así el puente no aparece de golpe. h = altura de 0 a 1; los puntos de rampa también
  // cuentan como nivel de puente (lv = 1) para el orden de dibujo.
  const N = pts.length, up = [];
  pts.forEach(p => p.h = p.lv > 0 ? 1 : 0);
  for (let i=0;i<N;i++) if (pts[i].lv > 0 && pts[(i-1+N)%N].lv <= 0) up.push(i, 1);       // principio de un tramo plano
  for (let i=0;i<N;i++) if (pts[i].lv > 0 && pts[(i+1)%N].lv <= 0) up.push(i, -1);        // final de un tramo plano
  for (let q=0;q<up.length;q+=2) for (let k=1;k<BRIDGE_RAMP;k++) {
    const j = (up[q] - up[q+1]*k + N*2) % N, t = 1 - k/BRIDGE_RAMP, h = t*t*(3-2*t);
    if (pts[j].lv < 0) break;                       // no se pisa un túnel
    if (h > pts[j].h) { pts[j].h = h; pts[j].lv = 1; }
  }
  return { center: pts, pieceStart };
}

// Recorrido de un carril: 'laps' vueltas seguidas, con el desplazamiento lateral dado por offsetAt(i, vuelta).
function makeRoute(center, laps, offsetAt) {
  const n = center.length;
  const x = [], y = [], lv = [];
  for (let loop=0; loop<laps; loop++) for (let i=0;i<n;i++) {
    const c = center[i], d = offsetAt(i, loop);
    x.push(c.x - Math.sin(c.th)*d); y.push(c.y + Math.cos(c.th)*d); lv.push(c.lv);
  }
  const m = x.length, s = [], th = [], seg = [];
  let acc = 0;
  for (let i=0;i<m;i++) {
    const j = (i+1) % m, dx = x[j]-x[i], dy = y[j]-y[i];
    s.push(acc); seg.push(Math.hypot(dx, dy)); th.push(Math.atan2(dy, dx)); acc += seg[i];
  }
  // curvatura numérica = cambio de rumbo / distancia
  const k = new Array(m);
  for (let i=0;i<m;i++) {
    const p = (i-1+m) % m;
    let dth = th[i] - th[p];
    dth = Math.atan2(Math.sin(dth), Math.cos(dth));
    k[i] = dth / ((seg[i] + seg[p])/2);
  }
  // Suavizamos la curvatura a lo largo de ~un largo de coche: la transición recta→curva
  // no es instantánea para el chasis (sin esto, cada entrada a curva da un latigazo).
  const W = 40, ks = new Array(m);
  let sum = 0; for (let i=-W;i<=W;i++) sum += k[(i+m)%m];
  for (let i=0;i<m;i++) { ks[i] = sum/(2*W+1); sum += k[(i+W+1)%m] - k[(i-W+m)%m]; }
  return { s, x, y, th, k: ks, lv, len: acc, half: laps === 2 ? s[n] : null };
}

function buildTrack(def0) {
  const def = def0.close ? { ...def0, pieces: closePieces(def0) } : def0;
  const { center, pieceStart } = buildCenter(def);
  let routes, starts, mid = null, lapLen;
  if (def.swap) {
    const n = center.length, sw = def.swap;
    const pieceN = pieceStart[sw.piece+1] - pieceStart[sw.piece];
    const x0 = pieceStart[sw.piece] + Math.round((pieceN - sw.len)/2);
    const offsetAt = (i, loop) => {
      const from = loop === 0 ? -LANE : LANE;          // vuelta 1: A→B, vuelta 2: B→A
      if (i < x0) return from;
      if (i >= x0 + sw.len) return -from;
      return from*Math.cos(Math.PI*(i - x0)/sw.len);   // S suave, sin quiebre en los extremos
    };
    const r = makeRoute(center, 2, offsetAt);
    routes = [r, r]; starts = [0, r.half]; mid = r.half; lapLen = r.len/2;
  } else {
    routes = [makeRoute(center, 1, () => -LANE), makeRoute(center, 1, () => LANE)];
    starts = [0, 0]; lapLen = routes[0].len;
  }
  return { id:def.id, name:def.name, def, center, pieceStart, routes, starts, mid, lapLen,
           raceDist: lapLen*LAPS, th0: def.th0 || 0,
           cx: center.map(p=>p.x), cy: center.map(p=>p.y), lvC: center.map(p=>p.lv), hC: center.map(p=>p.h) };
}
const builtTracks = {};
const getTrack = id => builtTracks[id] || (builtTracks[id] = buildTrack(TRACKS.find(t => t.id === id)));
let T = getTrack(DEFAULT_TRACK);            // pista actual
const rtOf = car => T.routes[car.lane];     // recorrido del carril en el que va el coche

function laneAt(lane, s) {
  s = ((s % lane.len) + lane.len) % lane.len;
  let lo=0, hi=lane.s.length-1;
  while (lo<hi) { const m=(lo+hi+1)>>1; if (lane.s[m]<=s) lo=m; else hi=m-1; }
  const i = lo, j = (i+1) % lane.s.length;
  const seg = (j===0 ? lane.len : lane.s[j]) - lane.s[i];
  const t = seg>0 ? (s-lane.s[i])/seg : 0;
  return { x: lane.x[i]+(lane.x[j]-lane.x[i])*t, y: lane.y[i]+(lane.y[j]-lane.y[i])*t, th: lane.th[i], k: lane.k[i], lv: lane.lv[i] };
}

// ---------- Estado ----------
let mode = 'libre';            // 'libre' | 'crono'
let clock = 0;
let skids = [];
const race = { phase:'idle', t0:0, lightsStart:0, goAt:0, ghost:null, rec:null, recStep:0, recDone:false, result:null };

function makeCar(name, color) {
  return { name, color, keys:[], start:0, lane:0, active:true, sprite:0 };
}
const cars = [ makeCar('ROJO', '#e8413c') ];
const player = cars[0];
const activeCars = () => cars.filter(c => c.active);

function resetCar(c) {
  Object.assign(c, { s:c.start, v:0, b:geoAngle(laneAt(rtOf(c), c.start).k), bd:0, thr:0, drift:0, sliding:false, off:null,
    lap:0, lapStart:null, last:null, best:null, offs:0, dist:0,
    splits:[], finished:false, finishT:null, falseStart:false, penUntil:0, react:null, reactAt:null });
}

// ---------- Input ----------
const down = new Set();
const typing = e => ['INPUT','TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range';
addEventListener('keydown', e => {
  if (typing(e)) return;
  initAudio();                                   // el navegador solo deja sonar después de un gesto del usuario
  if (e.code==='KeyM' && !e.repeat) setMuted(!audio.muted);
  if (['ArrowUp','ArrowDown','Space','Enter'].includes(e.code)) e.preventDefault();
  down.add(e.code);
  if (e.code==='KeyR') resetRace();
  if ((e.code==='Enter' || e.code==='NumpadEnter') && mode!=='libre' && !e.repeat) {
    if (race.phase==='done') resetRace();
    if (race.phase==='idle') startLights();
  }
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
addEventListener('pointerdown', () => initAudio());
if (document.addEventListener) document.addEventListener('visibilitychange', () => {   // en otra pestaña no tiene que seguir sonando
  if (audio.ctx) { if (document.hidden) audio.ctx.suspend(); else audio.ctx.resume(); }
});
const pressing = car => car.keys.some(k => down.has(k));

function updateThrottle(car, dt) {
  // Apretado acelera (rampa rápida), soltado vuelve a cero.
  const on = pressing(car) && !car.finished;
  car.thr += (on ? 3.5 : -6) * dt;
  car.thr = Math.min(1, Math.max(0, car.thr));
}

// ---------- Física ----------
// Modelo: la guía delantera va clavada en la ranura. El chasis es una barra rígida
// que pivota en la guía; el eje trasero tiene neumáticos con fuerza lateral
// lineal hasta saturar (círculo de fricción: lo que usás para acelerar o frenar
// no lo tenés para agarrar). b = ángulo del eje trasero respecto al carril.
// Ángulo que toma el chasis en curva sin patinar (el eje trasero va por dentro).
// La "deriva" es lo que el coche se cruza por encima de eso.
const geoAngle = k => Math.asin(Math.max(-1, Math.min(1, L*k)));

function stepCar(car, h) {
  if (car.off) return stepOff(car, h);
  const rt = rtOf(car);
  const { k } = laneAt(rt, car.s);
  const v = car.v, b = car.b;
  const grip = P.MU.v;

  // longitudinal (motor y freno pasan por las ruedas traseras)
  let motor = P.POWER.v*car.thr - (car.thr < 0.03 && v > 1 ? P.BRAKE.v : 0);
  motor = Math.max(-grip, Math.min(grip, motor));
  const latAvail = Math.sqrt(Math.max(0, grip*grip - motor*motor));
  const vdot = motor - DRAG*v - SCRUB*Math.abs(Math.sin(b))*v;

  // velocidad lateral del eje trasero respecto a donde apuntan las ruedas
  const slip = v*Math.sin(b) - L*v*k + L*car.bd;
  let Fy = -P.C.v*slip;
  const limit = car.sliding ? latAvail*P.KIN.v : latAvail;
  if (Math.abs(Fy) > limit) { Fy = Math.sign(Fy)*latAvail*P.KIN.v; car.sliding = true; }
  else car.sliding = false;

  const bdd = (Fy - vdot*Math.sin(b) - v*v*k*Math.cos(b))/L - DAMP*car.bd;
  car.bd += bdd*h;
  car.b  += car.bd*h;
  car.v   = Math.max(0, v + vdot*h);

  // vuelta: se cruza la línea en s = 0 y, si hay cruce de carriles, también en la mitad del recorrido
  const prev = car.s, ds = car.v*h;
  let next = prev + ds, crossed = false;
  if (next >= rt.len) { next -= rt.len; crossed = true; }
  else if (T.mid != null && prev < T.mid && next >= T.mid) crossed = true;
  car.s = next;
  car.dist += ds;

  if (crossed) {
    car.lap++;
    if (car.lapStart !== null) { car.last = clock-car.lapStart; if (!car.best || car.last<car.best) car.best = car.last; }
    car.lapStart = clock;
    if (mode !== 'libre' && !car.finished) {
      car.splits.push(clock - race.t0);
      sfxLap(car.lap >= LAPS);
      if (car.lap >= LAPS) finishCar(car);
    }
  }
  if (car.lapStart === null && car.v > 0) car.lapStart = clock;

  // ¿se sale? por ángulo excesivo o porque la guía no aguanta la fuerza
  car.drift = car.b - geoAngle(k);
  const tooWide = Math.abs(car.drift) > P.MAXANG.v*Math.PI/180;
  const guide = Math.abs(car.v*car.v*k) > P.GUIDE.v;
  if (tooWide || guide) deslot(car, k);
}

function deslot(car, k) {
  const q = laneAt(rtOf(car), car.s);
  const yaw = q.th - car.b;
  car.off = { x:q.x, y:q.y, vx:Math.cos(q.th)*car.v, vy:Math.sin(q.th)*car.v,
              yaw, w: car.v*k - car.bd, t:0, s:car.s, lv:q.lv };
  car.offs++;
}

function stepOff(car, h) {
  const o = car.off;
  o.t += h;
  const sp = Math.hypot(o.vx, o.vy);
  if (sp > 0) { const ns = Math.max(0, sp - 1400*h); o.vx *= ns/sp; o.vy *= ns/sp; }
  o.w *= Math.exp(-2.5*h);
  o.x += o.vx*h; o.y += o.vy*h; o.yaw += o.w*h;
  if (sp < 5 && o.t > 1.2) {   // el "comisario" lo vuelve a poner en la pista
    Object.assign(car, { s:o.s, v:0, b:geoAngle(laneAt(rtOf(car), o.s).k), bd:0, thr:0, sliding:false, off:null });
  }
}

// ---------- Carrera ----------
function resetRace() {
  race.phase = 'idle'; race.result = null; race.rec = null; race.recDone = false; race.endAt = null;
  if (mode === 'crono') {
    race.ghost = loadSelectedGhost();
    // largás en el carril opuesto al del fantasma
    player.lane = race.ghost ? 1 - race.ghost.startLane : 0;
  } else {
    race.ghost = null;
    player.lane = 0;
  }
  player.start = T.starts[player.lane];
  cars.forEach(resetCar);
  skids = [];
}

function startLights() {
  race.phase = 'lights';
  race.lightsStart = clock;
  race.goAt = clock + 5*0.8 + 0.4 + Math.random()*1.4;   // 5 luces, y se apagan tras una espera al azar
}

function go() {
  race.phase = 'running';
  race.t0 = clock;
  for (const c of activeCars()) { c.lapStart = clock; if (c.falseStart) c.penUntil = clock + PENALTY; }
  if (mode === 'crono') {
    race.rec = { dist:[], b:[], off:[], ox:[], oy:[], oyaw:[] };
    race.recStep = 0;
    sample(player);
  }
}

function finishCar(car) {
  car.finished = true;
  car.finishT = car.splits[LAPS-1];   // la penalización ya está en el tiempo: se paga frenado
  if (activeCars().every(c => c.finished)) race.endAt = clock + (mode==='crono' ? 0.3 : 0);
}

function sample(car) {
  const r = race.rec;
  r.dist.push(car.dist); r.b.push(car.off ? 0 : car.b); r.off.push(car.off ? 1 : 0);
  r.ox.push(car.off ? car.off.x : 0); r.oy.push(car.off ? car.off.y : 0); r.oyaw.push(car.off ? car.off.yaw : 0);
}

function endRace() {
  race.phase = 'done';
  if (mode === 'crono') {
    const g = {
      fmt:1, track:T.id, phys:PHYS_VERSION, name: playerName(), date: new Date().toISOString(), car: player.sprite,
      time: player.finishT, pen: 0, splits: player.splits.slice(),
      startLane: player.lane, hz: GHOST_HZ,
      dist: Float32Array.from(race.rec.dist), b: Float32Array.from(race.rec.b), off: Uint8Array.from(race.rec.off),
      ox: Float32Array.from(race.rec.ox), oy: Float32Array.from(race.rec.oy), oyaw: Float32Array.from(race.rec.oyaw),
    };
    const prevBest = loadGhost('best');
    const record = !prevBest || g.time < prevBest.time;
    saveGhost('last', g);
    if (record) saveGhost('best', g);
    race.result = { record, prevBest, vs: race.ghost };
    renderGhostList();
  }
}

function simStep() {
  clock += H;
  if (race.phase === 'lights' && clock >= race.goAt) go();
  const moving = mode === 'libre' || race.phase === 'running' || race.phase === 'done';
  for (const car of activeCars()) {
    if (!moving) {
      if (race.phase === 'lights' && pressing(car)) car.falseStart = true;
      car.thr = 0;
      continue;
    }
    updateThrottle(car, H);
    if (race.phase === 'running' && car.react === null && !car.falseStart && pressing(car)) {
      car.react = clock - race.t0; car.reactAt = clock;   // tiempo de reacción: de que se apagan las luces a que apretás
    }
    stepCar(car, H);
    if (clock < car.penUntil && !car.off && car.v > PENALTY_V) car.v = PENALTY_V;   // largada en falso: freno casi total
  }
  if (race.rec && !race.recDone && race.phase !== 'idle') {
    if (++race.recStep % (600/GHOST_HZ) === 0) { sample(player); if (player.finished) race.recDone = true; }
  }
  if (race.phase === 'running' && race.endAt != null && clock >= race.endAt) { race.endAt = null; endRace(); }
}

// Nivel de dibujo de un coche fuera de pista. Si salió desde un puente, sigue encima; si está sobre
// la rampa de un puente (que ahí es baja) también se dibuja encima, para que no parezca que se
// mete por debajo. Bajo el tramo plano, en cambio, sí queda tapado.
function offLevel(x, y, from) {
  if (from > 0) return 1;
  const { cx, cy, hC } = T, r2 = (ROAD_W/2 + 8)**2;
  for (let i=0;i<hC.length;i++) {
    if (hC[i] <= 0 || hC[i] >= 1) continue;
    const dx = cx[i]-x, dy = cy[i]-y;
    if (dx*dx + dy*dy < r2) return 1;
  }
  return 0;
}

// ---------- Fantasmas ----------
// Se graba la distancia recorrida y el ángulo de la cola (no las teclas): así se
// reproduce idéntico en cualquier navegador. Si el coche estaba fuera de pista,
// se graba su posición libre. El fantasma corre en su carril original.
function ghostPose(g, t) {
  const n = g.dist.length;
  let f = Math.max(0, t*g.hz), i = Math.floor(f);
  if (i >= n-1) { i = n-1; f = i; }
  const j = Math.min(i+1, n-1), a = f - i;
  if (g.off[i]) {
    const u = g.off[j] ? a : 0;
    return { x: g.ox[i]+(g.ox[j]-g.ox[i])*u, y: g.oy[i]+(g.oy[j]-g.oy[i])*u, yaw: g.oyaw[i]+(g.oyaw[j]-g.oyaw[i])*u, lv:offLevel(g.ox[i]+(g.ox[j]-g.ox[i])*u, g.oy[i]+(g.oy[j]-g.oy[i])*u, 0) };
  }
  const u = g.off[j] ? 0 : a;
  const dist = g.dist[i] + (g.dist[j]-g.dist[i])*u, b = g.b[i] + (g.b[j]-g.b[i])*u;
  const q = laneAt(T.routes[g.startLane], T.starts[g.startLane] + dist);
  return { x:q.x, y:q.y, yaw:q.th - b, lv:q.lv };
}

// ¿En qué momento pasó el fantasma por esta distancia?
function ghostTimeAt(g, D) {
  const d = g.dist, n = d.length;
  if (D <= d[0]) return 0;
  if (D > d[n-1]) return null;
  let lo = 0, hi = n-1;
  while (hi - lo > 1) { const m = (lo+hi)>>1; if (d[m] < D) lo = m; else hi = m; }
  const span = d[hi] - d[lo];
  return (lo + (span > 0 ? (D - d[lo])/span : 0)) / g.hz;
}

const lapTimes = splits => splits.map((t,i) => t - (i ? splits[i-1] : 0));

// --- guardado en el navegador ---
const store = {
  get(k) { try { return localStorage.getItem('slotdrift.'+k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('slotdrift.'+k, v); return true; } catch { return false; } },
};
const ARR = { dist:Float32Array, b:Float32Array, off:Uint8Array, ox:Float32Array, oy:Float32Array, oyaw:Float32Array };
function u8ToB64(u8) { let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function b64ToU8(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; }
function ghostToJSON(g) { const o = { ...g }; for (const k in ARR) o[k] = u8ToB64(new Uint8Array(g[k].buffer)); return JSON.stringify(o); }
function ghostFromJSON(str) {
  const o = JSON.parse(str);
  for (const [k, T] of Object.entries(ARR)) o[k] = new T(b64ToU8(o[k]).buffer);
  // el auto viene de afuera cuando se importa un fantasma: si no es un índice válido, se ignora
  if (!(Number.isInteger(o.car) && o.car >= 0 && o.car < CARS.length)) delete o.car;
  return o;
}
function validGhost(g) {
  if (!g || g.fmt !== 1) return 'No es un fantasma válido.';
  if (g.track !== T.id) return 'Es de otra pista.';
  if (g.phys !== PHYS_VERSION) return `Es de otra versión de la física (v${g.phys}; esta es v${PHYS_VERSION}).`;
  const n = g.dist.length;
  if (!n || [g.b, g.off, g.ox, g.oy, g.oyaw].some(a => a.length !== n)) return 'El fantasma está incompleto.';
  for (let i=1;i<n;i++) if (!(g.dist[i] >= g.dist[i-1])) return 'El fantasma tiene datos inconsistentes.';
  if (g.dist[n-1] < T.raceDist - 2) return 'El fantasma no completa la carrera.';
  if (!(g.splits?.length === LAPS) || !(g.time >= g.splits[LAPS-1])) return 'Los tiempos del fantasma no cierran.';
  return null;
}
const ghostKey = slot => `ghost.${slot}.${T.id}.v${PHYS_VERSION}`;
function loadGhost(slot) {
  const s = store.get(ghostKey(slot)); if (!s) return null;
  try { const g = ghostFromJSON(s); return validGhost(g) ? null : g; } catch { return null; }
}
const saveGhost = (slot, g) => store.set(ghostKey(slot), ghostToJSON(g));
let ghostChoice = store.get('ghostChoice') || 'best';
const loadSelectedGhost = () => ghostChoice === 'none' ? null : loadGhost(ghostChoice);
const playerName = () => (document.getElementById('name').value.trim() || 'Anónimo').slice(0, 20);

// --- exportar / importar (texto comprimido para mandar por chat o mail) ---
async function gzip(str) {
  if (!('CompressionStream' in window)) return null;
  return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
}
async function gunzip(u8) {
  return await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function exportGhost(slot) {
  const g = loadGhost(slot);
  if (!g) return toast('No hay fantasma para exportar.');
  const json = ghostToJSON(g), z = await gzip(json);
  const text = z ? 'SDG1.' + u8ToB64(z) : 'SDG0.' + btoa(unescape(encodeURIComponent(json)));
  const ok = await copyText(text);
  toast(ok ? `Fantasma copiado (${(text.length/1024).toFixed(1)} KB de texto). Pegalo donde quieras.` : 'No se pudo copiar.');
}
async function importGhost(text) {
  text = text.replace(/\s+/g, '');
  let json;
  try {
    if (text.startsWith('SDG1.')) json = await gunzip(b64ToU8(text.slice(5)));
    else if (text.startsWith('SDG0.')) json = decodeURIComponent(escape(atob(text.slice(5))));
    else return 'El texto no parece un fantasma (tiene que empezar con SDG1.).';
  } catch { return 'El texto está cortado o dañado.'; }
  let g; try { g = ghostFromJSON(json); } catch { return 'El texto está cortado o dañado.'; }
  // si es de otra pista que conocemos, cambiamos a esa pista
  if (g && g.track !== T.id) {
    if (!TRACKS.some(t => t.id === g.track)) return 'Es de una pista que este juego no conoce.';
    if (race.phase === 'running' || race.phase === 'lights') return 'Terminá la carrera antes de importar un fantasma de otra pista.';
    setTrack(g.track);
  }
  const err = validGhost(g); if (err) return err;
  saveGhost('imported', g);
  ghostChoice = 'imported'; store.set('ghostChoice', ghostChoice);
  renderGhostList();
  if (mode === 'crono' && race.phase !== 'running' && race.phase !== 'lights') resetRace();
  return null;
}

// ---------- Dibujo ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let view = { sc:1, ox:0, oy:0, dpr:1, fit:1, w:1, h:1 };
const HUD_H = 90;
let world = { minx:0, maxx:1, miny:0, maxy:1 };
function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const xs = T.cx, ys = T.cy, m = LANE+60;
  world = { minx:Math.min(...xs)-m, maxx:Math.max(...xs)+m, miny:Math.min(...ys)-m, maxy:Math.max(...ys)+m };
  // fit = escala (px CSS por unidad de mundo) con la que entra la pista completa
  const fit = Math.min(r.width/(world.maxx-world.minx), (r.height-HUD_H)/(world.maxy-world.miny));
  view = { ...view, fit, dpr, w:r.width, h:r.height };
}
addEventListener('resize', resize);

function carPose(car) {
  if (car.off) return { x:car.off.x, y:car.off.y, yaw:car.off.yaw, lv:offLevel(car.off.x, car.off.y, car.off.lv) };
  const q = laneAt(rtOf(car), car.s);
  return { x:q.x, y:q.y, yaw:q.th - car.b, lv:q.lv };
}

// ---------- Cámara ----------
// Fija: se ve la pista entera.
const cam = { x:0, y:0, s:1 };

function camTarget() {
  return { x:(world.minx+world.maxx)/2, y:(world.miny+world.maxy)/2, s:view.fit };
}

function updateCamera() {
  Object.assign(cam, camTarget());
  const sc = cam.s*view.dpr;
  view.sc = sc;
  view.ox = view.w/2*view.dpr - cam.x*sc;
  view.oy = (HUD_H + (view.h-HUD_H)/2)*view.dpr - cam.y*sc;
}

const ROAD_W = LANE*2 + 40;

// Tramos consecutivos donde pred(arr[i]) es verdadero; fn(a, b) con b inclusive.
function runsOf(arr, pred, fn) {
  let a = -1;
  for (let i=0;i<=arr.length;i++) {
    const ok = i < arr.length && pred(arr[i]);
    if (ok && a < 0) a = i; else if (!ok && a >= 0) { fn(a, i-1); a = -1; }
  }
}
// Polilínea por los puntos a..b+1 (cíclico), salteando de a 2 para aliviar el dibujo.
function tracePath(xs, ys, a, b) {
  const n = xs.length;
  ctx.moveTo(xs[a], ys[a]);
  for (let i=a+2;i<=b;i+=2) ctx.lineTo(xs[i], ys[i]);
  ctx.lineTo(xs[(b+1)%n], ys[(b+1)%n]);
}

function drawSlots(rt, pred) {
  const m = rt.x.length;
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
  runsOf(rt.lv, pred, (a, b) => { ctx.beginPath(); tracePath(rt.x, rt.y, a, b); ctx.stroke(); });
  ctx.strokeStyle = '#8a8f98'; ctx.lineWidth = 0.8; ctx.setLineDash([2,6]);
  runsOf(rt.lv, pred, (a, b) => {
    ctx.beginPath();
    for (const off of [-3.5, 3.5]) for (let i=a;i<=b+1;i+=3) {
      const j = i % m, X = rt.x[j] - Math.sin(rt.th[j])*off, Y = rt.y[j] + Math.cos(rt.th[j])*off;
      if (i === a) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);
}

// Capa de suelo: pianos, asfalto, ranuras y línea de salida (los tramos de puente y de túnel
// no se dibujan acá: van en sus propias capas).
function drawGround() {
  const { center, cx, cy, hC } = T, n = center.length;
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  // (bajo las rampas de los puentes también hay suelo: el puente se apoya encima, sin cortes)
  // pianos en curvas (de a trozos de 14 puntos, que alternan de color)
  ctx.lineWidth = LANE*2 + 52;
  for (let c0=0; c0<n; c0+=14) {
    ctx.beginPath(); let any = false;
    for (let i=c0; i<Math.min(c0+14, n); i++) if (center[i].arc && hC[i] < 1) {
      ctx.moveTo(cx[i], cy[i]); ctx.lineTo(cx[(i+1)%n], cy[(i+1)%n]); any = true;
    }
    if (any) { ctx.strokeStyle = (c0/14 % 2) ? '#d33' : '#eee'; ctx.stroke(); }
  }
  // asfalto
  ctx.strokeStyle = '#3a3d44'; ctx.lineWidth = ROAD_W;
  runsOf(hC, v => v < 1, (a, b) => { ctx.beginPath(); tracePath(cx, cy, a, b); ctx.stroke(); });
  // ranuras
  for (const rt of new Set(T.routes)) drawSlots(rt, v => v === 0);
  // línea de salida a cuadros (perpendicular al rumbo inicial)
  const half = LANE+20;
  ctx.save(); ctx.rotate(T.th0);
  for (let r=0;r<2;r++) for (let i=0;i<Math.ceil(half*2/6);i++) {
    ctx.fillStyle = (i+r)%2 ? '#111' : '#fff';
    ctx.fillRect(r*6-6, -half + i*6, 6, 6);
  }
  ctx.restore();
}

// Boca de un túnel: marco de piedra y la sombra de la entrada. dir = +1 entrada, -1 salida.
function drawPortal(i, dir) {
  const c = T.center[i], w = ROAD_W + 4;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.th);
  ctx.fillStyle = '#cfd1c8'; ctx.fillRect(dir > 0 ? 0 : -10, -w/2 - 8, 10, w + 16);
  ctx.fillStyle = '#0a0b0d'; ctx.fillRect(-3, -w/2, 6, w);
  ctx.restore();
}

// Techo de los túneles: opaco, se dibuja después de los coches de suelo para taparlos.
function drawTunnels() {
  const { cx, cy, lvC, center } = T, n = center.length;
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  runsOf(lvC, v => v < 0, (a, b) => {
    ctx.beginPath(); tracePath(cx, cy, a, b);
    ctx.strokeStyle = '#2a2d26'; ctx.lineWidth = ROAD_W + 40; ctx.stroke();
    ctx.strokeStyle = '#575c4e'; ctx.lineWidth = ROAD_W + 26; ctx.stroke();
    ctx.strokeStyle = '#6b7160'; ctx.lineWidth = ROAD_W - 6;  ctx.stroke();
    drawPortal(a, 1); drawPortal((b+1) % n, -1);
  });
}

// Banda de ancho variable alrededor de la línea central entre los puntos a..b (más el siguiente):
// half(i) es el semiancho y shift(i) el desplazamiento [dx, dy] en cada punto. Se rellena de una vez,
// así una sombra translúcida no se oscurece donde se solaparían tramos.
function fillStrip(a, b, half, shift, style) {
  const { cx, cy, center } = T, n = center.length, L = [], R = [];
  for (let i=a;i<=b+1;i++) {
    const j = i % n, nx = -Math.sin(center[j].th), ny = Math.cos(center[j].th), w = half(j), [dx, dy] = shift(j);
    L.push(cx[j] + nx*w + dx, cy[j] + ny*w + dy); R.push(cx[j] - nx*w + dx, cy[j] - ny*w + dy);
  }
  ctx.beginPath(); ctx.moveTo(L[0], L[1]);
  for (let i=2;i<L.length;i+=2) ctx.lineTo(L[i], L[i+1]);
  for (let i=R.length-2;i>=0;i-=2) ctx.lineTo(R[i], R[i+1]);
  ctx.closePath(); ctx.fillStyle = style; ctx.fill();
}

// Puentes: sombra sobre el suelo, barandas, calzada y ranuras. Van encima de todo lo demás. La altura
// (T.hC) crece en las rampas: la sombra se aleja y las barandas aparecen de a poco, sin escalón.
function drawBridges() {
  const { hC, lvC } = T, none = () => [0, 0];
  runsOf(lvC, v => v > 0, (a, b) => {
    fillStrip(a, b, i => ROAD_W/2 + 7*hC[i], i => [7*hC[i], 10*hC[i]], 'rgba(0,0,0,.35)');
    fillStrip(a, b, i => ROAD_W/2 + 7*hC[i], none, '#bcc0c7');
    fillStrip(a, b, () => ROAD_W/2, none, '#3a3d44');
  });
  for (const rt of new Set(T.routes)) drawSlots(rt, v => v > 0);
}

// Autos: los 12 de "Sport Cars Top View" (macrovector, vía Magnific), recortados como sprites de
// 256 px con el frente a la derecha. 'short' es el rótulo del HUD y 'color' su acento.
const CARS = [
  { name:'Superdeportivo blanco',      short:'BLANCO',    color:'#e8e8e8' },
  { name:'Amarillo',                   short:'AMARILLO',  color:'#ffd23f' },
  { name:'Blanco con alerón',          short:'ALERÓN',    color:'#e8e8e8' },
  { name:'Azul y rojo',                short:'AZUL/ROJO', color:'#3c8ee8' },
  { name:'Celeste',                    short:'CELESTE',   color:'#4cc3e8' },
  { name:'Blanco con franjas negras',  short:'FRANJAS',   color:'#e8e8e8' },
  { name:'Fórmula roja',               short:'FÓRMULA',   color:'#e8413c' },
  { name:'Amarillo con franjas rojas', short:'RALLY',     color:'#ffb000' },
  { name:'Blanco, ventana negra',      short:'VENTANA',   color:'#e8e8e8' },
  { name:'Blanco, techo negro',        short:'TECHO',     color:'#e8e8e8' },
  { name:'Azul petróleo',              short:'PETRÓLEO',  color:'#2aa6c0' },
  { name:'Blanco, capó',               short:'CAPÓ',      color:'#e8e8e8' },
];
const CAR_LEN = 47, CAR_FRONT = 12;   // el sprite ocupa de x = -35 a x = +12 en el marco del coche (la guía está en x = 0)
const spriteUrl = i => 'assets/cars/car' + String(i).padStart(2, '0') + '.png';
const sprites = CARS.map((c, i) => {
  const o = { levels:null, aspect:2.1 };
  if (typeof Image === 'undefined') return o;
  const im = new Image();
  im.onload = () => {
    o.aspect = im.naturalWidth / im.naturalHeight;
    // mipmaps: bajar de 256 a ~46 px de un solo salto se ve granulado; se achica a la mitad por vez
    const lv = [{ c: im, w: im.naturalWidth }];
    for (let w = im.naturalWidth/2; w >= 32; w /= 2) {
      const cnv = document.createElement('canvas'); cnv.width = w; cnv.height = Math.round(w/o.aspect);
      const g = cnv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(lv[lv.length-1].c, 0, 0, cnv.width, cnv.height);
      lv.push({ c: cnv, w });
    }
    o.levels = lv;
  };
  im.src = spriteUrl(i);
  return o;
});
const ghostCar = g => Number.isInteger(g.car) ? g.car : 0;

function drawCar({ x, y, yaw }, i, alpha = 1) {
  const spr = sprites[i] && sprites[i].levels ? sprites[i] : null;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(yaw);
  if (spr) {
    const w = CAR_LEN, h = CAR_LEN/spr.aspect, need = w*view.sc;        // largo en píxeles de pantalla
    let lv = spr.levels[0]; for (const l of spr.levels) if (l.w >= need) lv = l;   // el nivel más chico que alcanza
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(lv.c, CAR_FRONT - w, -h/2, w, h);
  } else {   // mientras carga el sprite: el coche dibujado
    ctx.fillStyle = '#111';
    ctx.fillRect(-L-5, -12, 11, 5); ctx.fillRect(-L-5, 7, 11, 5);
    ctx.fillRect(-3, -11, 9, 4); ctx.fillRect(-3, 7, 9, 4);
    ctx.fillStyle = CARS[i].color;
    ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(10, 6); ctx.lineTo(-2, 9); ctx.lineTo(-L-9, 9); ctx.lineTo(-L-9, -9); ctx.lineTo(-2, -9); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function addSkid(car) {
  if (!car.sliding || car.off) return;
  const { x, y, yaw, lv } = carPose(car);
  if (lv !== 0) return;
  const rx = x - Math.cos(yaw)*L, ry = y - Math.sin(yaw)*L;
  for (const side of [-9.5, 9.5]) skids.push({ x: rx - Math.sin(yaw)*side, y: ry + Math.cos(yaw)*side, t: clock });
  if (skids.length > 6000) skids.splice(0, skids.length-6000);
}

function drawSkids() {
  for (const m of skids) {
    const a = Math.max(0, 0.35 - (clock-m.t)*0.04);
    if (a <= 0) continue;
    ctx.fillStyle = `rgba(10,10,10,${a})`; ctx.fillRect(m.x-1.5, m.y-1.5, 3, 3);
  }
}

const fmt = t => t==null ? '–' : t.toFixed(2)+' s';
const fmtD = d => (d < 0 ? '−' : '+') + Math.abs(d).toFixed(2);
const raceTime = car => car.finished ? car.finishT : (race.phase === 'running' ? clock - race.t0 : 0);

// Recuadro del HUD (arriba a la izquierda): rótulo chico arriba y valor grande abajo.
function hudBox(x, w, label, value, color) {
  const y = 8, h = 70;
  box(x + w/2, y + h/2, w, h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8a8f98'; ctx.font = '600 11px system-ui'; ctx.fillText(label, x + w/2, y + 20);
  ctx.fillStyle = color || '#e8e8e8'; ctx.font = '700 28px system-ui'; ctx.fillText(value, x + w/2, y + 54);
  ctx.textAlign = 'left';
  return x + w + 8;
}

// Diferencia contra el fantasma: en vivo mientras corrés y, al terminar, el resultado final.
function ghostGap() {
  const g = race.ghost;
  if (!g) return null;
  if (player.finished) return player.finishT - g.time;
  if (race.phase !== 'running') return null;
  const tg = ghostTimeAt(g, player.dist);
  return tg != null && player.dist > 30 ? (clock - race.t0) - tg - g.pen : null;
}

function drawHud() {
  const dpr = view.dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = cv.width/dpr;
  let x = 16;
  if (mode === 'libre') {
    x = hudBox(x, 96, 'VUELTA', String(player.lap));
    hudBox(x, 112, 'ÚLTIMA', player.last == null ? '–' : player.last.toFixed(2));
  } else {
    x = hudBox(x, 96, 'VUELTA', `${Math.min(player.lap+1, LAPS)}/${LAPS}`);
    x = hudBox(x, 112, 'TIEMPO', raceTime(player).toFixed(2));
    if (race.ghost) {
      const d = ghostGap();
      hudBox(x, 118, 'VS FANTASMA', d == null ? '–' : fmtD(d), d == null ? '#8a8f98' : (d <= 0 ? '#4cd36a' : '#ff5a4f'));
    }
    drawRaceOverlay(w, cv.height/dpr);
  }
}

function box(cx, cy, bw, bh) {
  ctx.fillStyle = 'rgba(16,18,22,.88)'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(cx-bw/2, cy-bh/2, bw, bh, 10); ctx.fill(); ctx.stroke();
}

function drawRaceOverlay(w, hgt) {
  const cx = w/2, cy = HUD_H + (hgt-HUD_H)/2;
  ctx.textAlign = 'center';
  if (race.phase === 'idle') {   // el cartel ocupa el lugar del semáforo
    box(cx, 43, 254, 70);
    ctx.fillStyle = '#e8e8e8'; ctx.font = '600 17px system-ui'; ctx.fillText('Enter para largar', cx, 38);
    ctx.fillStyle = '#8a8f98'; ctx.font = '11px system-ui';
    ctx.fillText(`${LAPS} vueltas · no aceleres antes de tiempo`, cx, 60);
  }
  // Semáforo arriba y al centro. Con las luces verdes espera tu reacción y la muestra ahí mismo; a los
  // pocos segundos desaparece. Si hubo largada en falso, muestra el tiempo de freno que queda.
  const sinceGo = clock - race.t0, tx = w/2, ty = 43;
  let show = race.phase === 'lights';
  if (race.phase === 'running') {
    if (player.falseStart) show = clock < player.penUntil + 1;
    else show = player.react !== null ? clock - player.reactAt < 2.5 : sinceGo < 3;
  }
  if (show) {
    box(tx, ty, 5*40+24, 70);
    if (race.phase === 'running' && player.falseStart) {
      ctx.fillStyle = '#ff5a4f'; ctx.font = '700 18px system-ui'; ctx.fillText('Largada en falso', tx, ty - 4);
      ctx.fillStyle = '#e8e8e8'; ctx.font = '600 14px system-ui';
      ctx.fillText(clock < player.penUntil ? `freno ${(player.penUntil - clock).toFixed(1)} s` : 'liberado', tx, ty + 20);
    } else if (race.phase === 'running' && player.react !== null) {
      ctx.fillStyle = player.react < 0.3 ? '#4cd36a' : '#e8e8e8'; ctx.font = '700 32px system-ui';
      ctx.fillText(`${player.react.toFixed(3)} s`, tx, ty + 8);
      ctx.fillStyle = '#8a8f98'; ctx.font = '600 11px system-ui'; ctx.fillText('REACCIÓN', tx, ty - 22);
    } else {
      const on = race.phase === 'lights' ? Math.min(5, Math.floor((clock - race.lightsStart)/0.8)) : 0;
      for (let i=0;i<5;i++) {
        ctx.beginPath(); ctx.arc(tx - 2*40 + i*40, ty, 15, 0, Math.PI*2);
        ctx.fillStyle = race.phase === 'running' ? '#2fd05a' : (i < on ? '#ff2a1f' : '#2a1414'); ctx.fill();
      }
    }
  }
  if (race.phase === 'done' && race.result) drawResults(cx, cy);
  ctx.textAlign = 'left';
}

function drawResults(cx, cy) {
  const r = race.result;
  const rows = [];   // [texto, color, fuente]
  if (mode === 'crono') {
    rows.push([r.record ? '¡Nuevo récord!' : 'Resultado', r.record ? '#ffd34d' : '#e8e8e8', '700 22px system-ui']);
    rows.push([`Tiempo ${fmt(player.finishT)}` + (player.falseStart ? `  (largada en falso: ${PENALTY} s frenado)` : ''), '#e8e8e8', '600 15px system-ui']);
    if (player.react !== null) rows.push([`Reacción ${player.react.toFixed(3)} s`, '#8a8f98', '13px system-ui']);
    if (r.vs) {
      const d = player.finishT - r.vs.time;
      rows.push([`vs ${r.vs.name}: ${fmtD(d)} s`, d <= 0 ? '#4cd36a' : '#ff5a4f', '600 15px system-ui']);
    }
    rows.push(['', '', '']);
    const mine = lapTimes(player.splits), theirs = r.vs ? lapTimes(r.vs.splits) : null;
    rows.push([theirs ? 'Vuelta      Vos      Fantasma     Dif' : 'Vuelta      Tiempo', '#8a8f98', '12px monospace']);
    mine.forEach((t, i) => {
      const line = theirs ? `  ${i+1}      ${t.toFixed(2).padStart(6)}    ${theirs[i].toFixed(2).padStart(6)}    ${fmtD(t - theirs[i]).padStart(6)}`
                          : `  ${i+1}      ${t.toFixed(2).padStart(6)}`;
      rows.push([line, '#e8e8e8', '13px monospace']);
    });
  }
  rows.push(['', '', '']);
  rows.push(['Enter: correr de nuevo', '#8a8f98', '12px system-ui']);
  const lh = 22, bh = rows.length*lh + 24;
  box(cx, cy, 420, bh);
  rows.forEach(([t, c, f], i) => { if (!t) return; ctx.fillStyle = c; ctx.font = f; ctx.fillText(t, cx, cy - bh/2 + 30 + i*lh); });
}

// Dibuja el fantasma y los coches cuyo nivel cumple pred (0 suelo, -1 túnel, +1 puente).
function drawCars(pred) {
  if (mode === 'crono' && race.ghost) {
    const t = race.phase === 'running' || race.phase === 'done' ? clock - race.t0 : 0;
    const gp = ghostPose(race.ghost, t);
    if (pred(gp.lv)) {
      drawCar(gp, ghostCar(race.ghost), 0.45);
      ctx.fillStyle = 'rgba(214,214,255,.7)'; ctx.font = '12px system-ui'; ctx.fillText(race.ghost.name, gp.x + 14, gp.y - 14);
    }
  }
  for (const car of activeCars()) { const q = carPose(car); if (pred(q.lv)) drawCar(q, car.sprite); }
}

// ---------- Sonido ----------
// Todo se genera con Web Audio, sin archivos, y apunta a sonar a slot y no a motor de combustión:
//  · motor: el zumbido agudo del colector (3 veces la frecuencia de giro del rotor), el chillido de los
//    engranajes (~8,5 veces) y el chisporroteo de las escobillas; todo sube de tono con la velocidad.
//    Al soltar el gatillo el rotor sigue girando y el tono baja solo, a medida que frena el coche.
//  · plástico contra plástico: un chirrido áspero (ruido filtrado y un silbido) cuando patina
//  · golpe y traqueteo cuando se sale, y un clic cuando el comisario lo vuelve a poner
//  · semáforo como en los juegos de F1: cinco pitidos iguales y uno más largo y agudo al apagarse
//  · campanita al cruzar la meta, y un zumbido grave si hay largada en falso
//  · dentro de un túnel se apagan los agudos, como si lo oyeras desde afuera
const audio = { ctx:null, master:null, car:null, tunnel:null, noise:null, V:null,
  vol:0.8, muted:false, prevOff:false, prevFalse:false, prevPhase:'idle', lightsOn:0 };
{ const v = store.get('vol'); if (v !== null) audio.vol = Math.min(1, Math.max(0, +v || 0)); audio.muted = store.get('mute') === '1'; }
const MAX_V = 1143;     // velocidad punta aproximada (potencia / rozamiento)

// ctxOverride solo lo usan las pruebas, para poder renderizar el sonido sin esperar un gesto del usuario
function initAudio(ctxOverride) {
  if (audio.ctx) { if (!ctxOverride && audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!ctxOverride && !AC) return;
  const c = audio.ctx = ctxOverride || new AC();
  const comp = c.createDynamicsCompressor();            // limitador suave: solo evita que se sature si se juntan varios sonidos fuertes
  if (comp.threshold) { comp.threshold.value = -8; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15; }
  audio.master = c.createGain(); audio.master.connect(comp); comp.connect(c.destination);
  audio.tunnel = c.createBiquadFilter(); audio.tunnel.type = 'lowpass'; audio.tunnel.frequency.value = 18000; audio.tunnel.connect(audio.master);
  audio.car = audio.tunnel;                              // por acá pasa todo lo que hace el coche
  const n = Math.floor(c.sampleRate*2), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  audio.noise = buf;
  const osc = type => { const o = c.createOscillator(); o.type = type; o.start(); return o; };
  const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };
  const filt = (type, f, q = 0.7) => { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const noiseSrc = () => { const src = c.createBufferSource(); src.buffer = audio.noise; src.loop = true; src.start(); return src; };
  const chain = (...nodes) => { for (let i=0;i<nodes.length-1;i++) nodes[i].connect(nodes[i+1]); };
  const V = audio.V = {}, out = gain(1); out.connect(audio.car);
  // motor
  V.rot  = osc('triangle');  V.gRot  = gain(0); chain(V.rot, V.gRot, out);
  V.buzz = osc('sawtooth');  V.buzzLP = filt('lowpass', 2000); V.gBuzz = gain(0); chain(V.buzz, V.buzzLP, V.gBuzz, out);
  V.gear = osc('sine');      V.gGear = gain(0); chain(V.gear, V.gGear, out);
  V.brush = noiseSrc(); V.gBrush = gain(0); chain(V.brush, filt('bandpass', 3200, 0.8), V.gBrush, out);
  V.lfo = osc('triangle');   V.lfoAmt = gain(0); chain(V.lfo, V.lfoAmt); V.lfoAmt.connect(V.gBrush.gain);   // el chisporroteo: el ruido de las escobillas tiembla
  V.roll = noiseSrc();       V.gRoll = gain(0); chain(V.roll, filt('lowpass', 320), V.gRoll, out);          // las ruedas rodando sobre la pista
  // chirrido
  V.skid = noiseSrc();       V.skidBP = filt('bandpass', 1800, 4); V.gSkid = gain(0); chain(V.skid, V.skidBP, V.gSkid, out);
  V.tone = osc('triangle');  V.gTone = gain(0); chain(V.tone, V.gTone, out);
  V.vib = osc('sine'); V.vib.frequency.value = 9; V.vibAmt = gain(35); chain(V.vib, V.vibAmt); V.vibAmt.connect(V.tone.frequency);
  applyVolume();
}

function applyVolume() {
  if (!audio.master) return;
  audio.master.gain.setTargetAtTime(audio.muted ? 0 : audio.vol*audio.vol, audio.ctx.currentTime, 0.02);
}

// Se llama en cada cuadro: acomoda el tono y el volumen de cada voz según el estado del coche.
function updateAudio() {
  const c = audio.ctx; if (!c || !audio.V) return;
  const V = audio.V, t = c.currentTime;
  const set = (p, v, tau = 0.04) => { if (Number.isFinite(v)) p.setTargetAtTime(v, t, tau); };
  const car = player, off = !!car.off;
  const v = off ? 0 : car.v, sp = Math.min(1, v/MAX_V), thr = car.thr;
  const run = !off && (v > 1.5 || thr > 0.03);
  // motor
  const A = run ? 0.25 + 0.55*sp + 0.20*thr : 0;
  const fr = 38 + 300*Math.pow(sp, 0.85);                 // giro del rotor (Hz)
  set(V.rot.frequency, fr); set(V.buzz.frequency, fr*3); set(V.gear.frequency, fr*8.5);
  set(V.gRot.gain, 0.10*A); set(V.gBuzz.gain, 0.16*A); set(V.gGear.gain, 0.03*A*(0.4 + sp));
  set(V.buzzLP.frequency, 700 + 3200*sp);
  const br = run ? 0.14*(0.35 + 0.65*sp)*(0.25 + 0.75*thr) : 0;
  set(V.gBrush.gain, br); set(V.lfoAmt.gain, br*0.9); set(V.lfo.frequency, 35 + 40*sp);
  set(V.gRoll.gain, run ? 0.16*sp : 0);
  // chirrido (patina) y raspado (se salió y va arrastrándose)
  const dd = Math.abs(car.drift || 0)*180/Math.PI;
  const slide = !off && car.sliding && v > 80 ? Math.min(1, 0.3 + dd/35)*Math.min(1, v/450) : 0;
  const scrape = off ? Math.min(1, Math.hypot(car.off.vx, car.off.vy)/500)*0.6 : 0;
  set(V.gSkid.gain, 0.45*Math.max(slide, scrape)); set(V.gTone.gain, 0.06*slide);
  set(V.skidBP.frequency, 1500 + 1500*sp); set(V.tone.frequency, 1100 + 1400*sp + 300*slide, 0.08);
  // túnel
  set(audio.tunnel.frequency, !off && carPose(car).lv < 0 ? 700 : 18000, 0.05);
  // eventos puntuales
  if (off && !audio.prevOff) sfxCrash(Math.hypot(car.off.vx, car.off.vy));
  if (!off && audio.prevOff) sfxClack(c.currentTime, 0.5);
  audio.prevOff = off;
  if (car.falseStart && !audio.prevFalse) sfxBuzzer();
  audio.prevFalse = car.falseStart;
  // semáforo: un pitido por cada luz que se enciende y uno largo y más agudo al apagarse
  if (race.phase === 'lights') {
    const on = Math.min(5, Math.floor((clock - race.lightsStart)/0.8));
    while (audio.lightsOn < on) { audio.lightsOn++; beep(1000, 0.2, 0.2); }
  } else {
    if (audio.prevPhase === 'lights' && race.phase === 'running') beep(1500, 0.6, 0.22);
    audio.lightsOn = 0;
  }
  audio.prevPhase = race.phase;
}

// Pitido electrónico: cuadrada filtrada, con ataque y cierre rápidos para que no haga clic.
function beep(freq, dur, vol, when = 0) {
  const c = audio.ctx; if (!c || !audio.master) return;
  const t = c.currentTime + when, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'square'; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = freq*4;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.setValueAtTime(vol, t + dur - 0.02); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(audio.master); o.start(t); o.stop(t + dur + 0.02);
}

// Zumbido grave de largada en falso.
function sfxBuzzer() {
  const c = audio.ctx; if (!c || !audio.master) return;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain(), trem = c.createOscillator(), tg = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = 140;
  trem.frequency.value = 18; tg.gain.value = 0.05; trem.connect(tg); tg.connect(g.gain);   // un temblor que lo hace sonar a chicharra
  g.gain.setValueAtTime(0.12, t); g.gain.setValueAtTime(0.12, t + 0.4); g.gain.linearRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g); g.connect(audio.master); o.start(t); trem.start(t); o.stop(t + 0.55); trem.stop(t + 0.55);
}

// Campanita: dos senoidas con decaimiento. Al terminar la carrera suena un arpegio.
function ding(f, when, vol) {
  const c = audio.ctx, t = c.currentTime + when, g = c.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45); g.connect(audio.master);
  for (const k of [1, 2.01]) { const o = c.createOscillator(); o.frequency.value = f*k; o.connect(g); o.start(t); o.stop(t + 0.5); }
}
function sfxLap(final) {
  if (!audio.ctx || !audio.master) return;
  ding(1318, 0, 0.2);
  if (final) { ding(1760, 0.13, 0.2); ding(2093, 0.26, 0.2); }
}

// Un clac de plástico: ráfaga corta de ruido filtrado.
function sfxClack(t, a) {
  const c = audio.ctx; if (!c || !audio.car) return;
  const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
  s.buffer = audio.noise; bp.type = 'bandpass'; bp.frequency.value = 900 + Math.random()*2600; bp.Q.value = 2.5;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.2*a, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  s.connect(bp); bp.connect(g); g.connect(audio.car); s.start(t, Math.random()*1.5); s.stop(t + 0.07);
}

// Se sale de la pista: un golpe grave y el traqueteo del plástico, cada vez más espaciado.
function sfxCrash(speed) {
  const c = audio.ctx; if (!c || !audio.car) return;
  const t = c.currentTime, a = Math.min(1, 0.25 + speed/900), o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.18);
  g.gain.setValueAtTime(0.6*a, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(audio.car); o.start(t); o.stop(t + 0.25);
  let tt = t;
  for (let i=0;i<6;i++) { sfxClack(tt, a*(1 - i*0.13)); tt += 0.03 + i*0.045 + Math.random()*0.03; }
}

function setMuted(m) {
  audio.muted = !!m; store.set('mute', audio.muted ? '1' : '0');
  $('muteBtn').textContent = audio.muted ? 'Activar sonido' : 'Silenciar';
  $('muteBtn').classList.toggle('on', audio.muted);
  applyVolume();
}

// ---------- Bucle ----------
// Paso de simulación fijo: la física avanza siempre de a 1/600 s, sin importar
// los FPS. Así una vuelta da el mismo resultado en cualquier máquina.
const H = 1/600;
let lastT = performance.now(), accum = 0;
function frame(now) {
  const dtr = Math.min(0.1, (now-lastT)/1000); accum += dtr; lastT = now;
  while (accum >= H) { accum -= H; simStep(); }
  updateAudio();
  for (const car of activeCars()) addSkid(car);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#1f3a24'; ctx.fillRect(0,0,cv.width,cv.height);
  updateCamera(dtr);
  ctx.setTransform(view.sc,0,0,view.sc,view.ox,view.oy);
  // capas, de abajo hacia arriba: suelo → coches de suelo → techos de túnel → puentes → coches de puente
  drawGround(); drawSkids();
  drawCars(lv => lv <= 0);
  drawTunnels();
  drawBridges();
  drawCars(lv => lv > 0);
  drawHud();
  requestAnimationFrame(frame);
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const sliderRefs = {};
for (const [key, p] of Object.entries(P)) {
  const lab = document.createElement('label');
  lab.innerHTML = `${p.label} <span>${p.v}</span><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}">`;
  const inp = lab.querySelector('input'), out = lab.querySelector('span');
  inp.addEventListener('input', () => { if (mode !== 'libre') return; p.v = freeVals[key] = +inp.value; out.textContent = inp.value; });
  inp.addEventListener('keydown', e => e.preventDefault()); // que las flechas no muevan el slider
  sliderRefs[key] = { inp, out };
  $('sliders').appendChild(lab);
}

function applyParams() {
  const src = mode === 'libre' ? freeVals : OFFICIAL;
  for (const k in P) { P[k].v = src[k]; sliderRefs[k].inp.value = src[k]; sliderRefs[k].out.textContent = src[k]; sliderRefs[k].inp.disabled = mode !== 'libre'; }
  $('sliders').classList.toggle('locked', mode !== 'libre');
  $('physNote').textContent = mode === 'libre' ? 'Ajustable en modo Libre.' : `Física oficial v${PHYS_VERSION}: bloqueada para que los tiempos sean comparables.`;
}

const MODE_INFO = {
  libre: { hint:'Práctica sin tiempo oficial. Los sliders se pueden tocar.', keys:'Acelerar: <kbd>W</kbd> o <kbd>↑</kbd><br><kbd>R</kbd> reiniciar' },
  crono: { hint:`${LAPS} vueltas contra un fantasma. Largás en el carril opuesto al suyo.`, keys:'Acelerar: <kbd>W</kbd> o <kbd>↑</kbd><br><kbd>Enter</kbd> largar · <kbd>R</kbd> reiniciar' },
};
function setMode(m) {
  mode = m; store.set('mode', m);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('modeHint').textContent = MODE_INFO[m].hint;
  $('keysHint').innerHTML = MODE_INFO[m].keys;
  $('ghostBox').style.display = m === 'crono' ? '' : 'none';
  player.keys = ['KeyW', 'ArrowUp'];
  applyParams();
  resetRace();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { setMode(b.dataset.mode); b.blur(); });

function setTrack(id) {
  T = getTrack(id);
  store.set('track', id); $('trackSel').value = id;
  resize();            // recalcula el encuadre de la pista completa
  renderGhostList();   // los fantasmas son por pista
  resetRace();
}
for (const t of TRACKS) $('trackSel').add(new Option(t.name, t.id));
$('trackSel').onchange = e => { setTrack(e.target.value); e.target.blur(); };

function renderGhostList() {
  const opts = [['none', 'Sin fantasma', null], ['best', 'Mi mejor', loadGhost('best')], ['last', 'Mi última', loadGhost('last')], ['imported', 'Importado', loadGhost('imported')]];
  $('ghostList').innerHTML = '';
  for (const [val, label, g] of opts) {
    const dis = val !== 'none' && !g;
    const row = document.createElement('label');
    row.className = 'radio' + (dis ? ' dis' : '');
    row.innerHTML = `<input type="radio" name="ghost" value="${val}" ${dis?'disabled':''} ${ghostChoice===val?'checked':''}>
      <span>${label}${g ? ` <small>· ${g.name.replace(/[<&>"]/g,'')} · ${fmt(g.time)}</small>` : (dis ? ' <small>· todavía no hay</small>' : '')}</span>`;
    row.querySelector('input').onchange = e => {
      ghostChoice = val; store.set('ghostChoice', val); e.target.blur();
      if (race.phase !== 'running' && race.phase !== 'lights') resetRace();
    };
    $('ghostList').appendChild(row);
  }
  $('expBest').disabled = !opts[1][2];
  $('expLast').disabled = !opts[2][2];
}

$('name').value = store.get('name') || '';
$('name').addEventListener('input', () => store.set('name', $('name').value));
$('expBest').onclick = e => { e.target.blur(); exportGhost('best'); };
$('expLast').onclick = e => { e.target.blur(); exportGhost('last'); };
$('impBtn').onclick = e => { e.target.blur(); $('impText').value = ''; $('impMsg').textContent = ''; $('impDlg').showModal(); };
$('impCancel').onclick = () => $('impDlg').close();
$('impOk').onclick = async () => {
  const err = await importGhost($('impText').value);
  if (err) { $('impMsg').textContent = err; return; }
  $('impDlg').close(); toast('Fantasma importado y seleccionado.');
};

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    // Fallback para cuando el portapapeles no está disponible (p. ej. abierto como file:// en algunos navegadores)
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const copyBtn = $('copy');
copyBtn.onclick = async () => {
  const text = JSON.stringify(Object.fromEntries(Object.entries(P).map(([k, p]) => [k, p.v])), null, 2);
  const ok = await copyText(text);
  copyBtn.textContent = ok ? '¡Copiado!' : 'No se pudo copiar';
  copyBtn.blur();
  setTimeout(() => copyBtn.textContent = 'Copiar parámetros', 1500);
};

function selectCar(i) {
  i = Math.min(CARS.length-1, Math.max(0, i|0));
  player.sprite = i; player.color = CARS[i].color; player.name = CARS[i].short;
  store.set('car', i);
  document.querySelectorAll('#carGrid button').forEach((b, k) => b.classList.toggle('on', k === i));
}
CARS.forEach((c, i) => {
  const b = document.createElement('button'); b.title = c.name;
  b.innerHTML = `<img src="${spriteUrl(i)}" alt="${c.name}">`;
  b.onclick = () => { selectCar(i); b.blur(); };
  $('carGrid').appendChild(b);
});
selectCar(+store.get('car') || 0);

$('muteBtn').onclick = e => { setMuted(!audio.muted); e.target.blur(); };
$('vol').value = audio.vol; $('volVal').textContent = Math.round(audio.vol*100) + '%';
$('vol').addEventListener('input', () => { audio.vol = +$('vol').value; $('volVal').textContent = Math.round(audio.vol*100) + '%'; store.set('vol', audio.vol); applyVolume(); });
$('vol').addEventListener('keydown', e => e.preventDefault());
setMuted(audio.muted);

// ?pista=<id> permite abrir el juego directo en una pista (para compartir o probar)
const qs = new URLSearchParams(location.search);
const wantTrack = [qs.get('pista'), store.get('track')].find(id => TRACKS.some(t => t.id === id)) || DEFAULT_TRACK;
T = getTrack(wantTrack); $('trackSel').value = wantTrack;
renderGhostList();
setMode(['libre','crono'].includes(store.get('mode')) ? store.get('mode') : 'libre');
resize();
requestAnimationFrame(frame);
</script>
